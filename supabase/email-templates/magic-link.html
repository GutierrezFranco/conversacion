<!-- Pegar en Supabase → Authentication → Email Templates → Magic Link (y también en «Confirm signup»).
     Asunto sugerido: «Tu link para entrar a Edición Simple» -->
<div style="background:#0b0a0f;padding:32px 16px;font-family:Arial,Helvetica,sans-serif">
  <div style="max-width:460px;margin:0 auto;background:#15131c;border:1px solid #2a2635;border-radius:16px;padding:32px;color:#f4f2f8">
    <div style="font-size:20px;font-weight:bold;margin-bottom:24px">
      <span style="display:inline-block;width:28px;height:28px;border-radius:8px;background:#ff6a1a;vertical-align:middle"></span>
      <span style="vertical-align:middle;margin-left:8px">Edición <span style="color:#ff8a3d">Simple</span></span>
    </div>
    <h1 style="font-size:22px;margin:0 0 12px">Tu link para entrar</h1>
    <p style="color:#9a94a8;line-height:1.5;margin:0 0 24px">Tocá el botón para entrar a tu cuenta. El link sirve una sola vez y vence en una hora.</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#ff6a1a;color:#160800;font-weight:bold;text-decoration:none;padding:14px 26px;border-radius:999px">Entrar a Edición Simple</a>
    <p style="color:#6f6a7c;font-size:12px;line-height:1.5;margin:28px 0 0">Si no pediste este mail, podés ignorarlo: nadie va a poder entrar a tu cuenta sin este link.</p>
  </div>
</div>
